services:

  target:
    build: ./docker/target
    environment:
      - SCENARIO=${SCENARIO:-01-easy-flag}
    volumes:
      - ./docker/scenarios:/scenarios:ro
    container_name: target
    networks: [sandbox]

  executor:
    build: ./docker/executor
    container_name: command_executor
    environment:
      - SCENARIO=${SCENARIO:-01-easy-flag}
    volumes:
      - ./docker/scenarios:/scenarios:ro

    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    networks:
      - sandbox

networks:
  sandbox:
    internal: true